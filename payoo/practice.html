<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Practice javascript</title>
	<link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
	<section class="bg-base-100 text-base-content p-8"> 
		<h1 class="text-center">Payoo MFS</h1>
		<div class="flex items-center justify-center min-h-screen border border-gray-600 rounded-lg">
			<fieldset class="fieldset bg-base-200 border-base-300 rounded-box w-xs border p-4">
				<legend class="fieldset-legend">Login</legend>

				<label class="label">Your Phone Number</label>
				<input id="phone-number" type="text" class="input" placeholder="enter your phone number" />

				<label class="label">Pin</label>
				<input id="pin-number" type="password" class="input" placeholder="enter your pin" />

				<button id="btn-login" class="btn btn-neutral mt-4">Login</button>
			</fieldset>
		</div>
	</section>

	<script src="./practice.js"></script>
</body>
</html>
